<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin — Sweet Home Mousse's</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #111;
      color: white;
    }

    .btn-success {
      background: #198754;
      color: white;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-secondary {
      background: #ddd;
      color: #222;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    /* LOGIN */

    .login {
      width: calc(100% - 30px);
      max-width: 420px;
      margin: 70px auto;
    }

    .login h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .login p {
      color: #666;
      line-height: 1.5;
    }

    /* CAMPOS */

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    /* STATUS */

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    header .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header small {
      display: block;
      margin-top: 4px;
      opacity: .7;
    }

    /* CONTEÚDO */

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px 50px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    /* PRODUTOS */

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 14px;
      background: #fff;
    }

    .product.inactive {
      opacity: .55;
    }

    .product img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .product-desc {
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
    }

    .old-price {
      text-decoration: line-through;
      color: #999;
      margin-left: 7px;
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      background: #eee;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 11px;
      margin-top: 7px;
    }

    /* FOTO */

    .preview {
      margin-top: 10px;
    }

    .preview img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 750px) {

      .grid,
      .grid-3,
      .product-list {
        grid-template-columns: 1fr;
      }

      .product {
        flex-direction: column;
      }

      .product img {
        width: 100%;
        height: 200px;
      }

      header .top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <section id="loginScreen" class="login card">

    <h1>🔐 Administração</h1>

    <p>
      Entre com o e-mail e a senha do administrador.
    </p>

    <div id="loginStatus" class="status"></div>

    <div class="field">
      <label for="email">E-mail</label>

      <input
        id="email"
        type="email"
        placeholder="Seu e-mail"
        autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Senha</label>

      <input
        id="password"
        type="password"
        placeholder="Sua senha"
        autocomplete="current-password">
    </div>

    <button
      id="loginButton"
      class="btn-primary"
      style="width:100%;"
      onclick="login()">

      Entrar

    </button>

  </section>


  <!-- =====================================================
       PAINEL ADMIN
       ===================================================== -->

  <div id="adminScreen" class="hidden">

    <header>

      <div class="top">

        <div>
          <h1>🍰 Sweet Home Mousse's</h1>

          <small>
            Painel administrativo
          </small>
        </div>

        <button
          class="btn-secondary"
          onclick="logout()">

          Sair

        </button>

      </div>

    </header>


    <main>

      <div id="globalStatus" class="status"></div>


      <!-- =================================================
           FORMULÁRIO
           ================================================= -->

      <section class="card">

        <div class="section-title">

          <h2 id="formTitle">
            ➕ Novo produto
          </h2>

          <button
            id="cancelEdit"
            class="btn-secondary hidden"
            onclick="cancelEdit()">

            Cancelar edição

          </button>

        </div>


        <input
          type="hidden"
          id="productId">


        <div class="grid">

          <div class="field">

            <label for="name">
              Nome do produto *
            </label>

            <input
              id="name"
              type="text"
              placeholder="Ex.: Tentação de Morango">

          </div>


          <div class="field">

            <label for="category">
              Categoria *
            </label>

            <select id="category">

              <option value="garrafa">
                Tentações em Garrafa
              </option>

              <option value="bebida">
                Bebida
              </option>

            </select>

          </div>

        </div>


        <div class="field">

          <label for="description">
            Descrição
          </label>

          <textarea
            id="description"
            placeholder="Descrição do produto"></textarea>

        </div>


        <div class="grid-3">

          <div class="field">

            <label for="price">
              Preço *
            </label>

            <input
              id="price"
              type="number"
              min="0"
              step="0.01"
              placeholder="20.00">

          </div>


          <div class="field">

            <label for="oldPrice">
              Preço antigo
            </label>

            <input
              id="oldPrice"
              type="number"
              min="0"
              step="0.01"
              placeholder="23.00">

          </div>


          <div class="field">

            <label for="sortOrder">
              Ordem
            </label>

            <input
              id="sortOrder"
              type="number"
              min="0"
              step="1"
              value="0">

          </div>

        </div>


        <div class="field">

          <label for="image">
            Foto do produto
          </label>

          <input
            id="image"
            type="file"
            accept="image/*"
            onchange="previewImage(event)">

          <div
            id="preview"
            class="preview">
          </div>

        </div>


        <div class="field">

          <label>

            <input
              id="active"
              type="checkbox"
              checked
              style="width:auto;margin-right:7px;">

            Produto ativo no cardápio

          </label>

        </div>


        <div class="actions">

          <button
            class="btn-success"
            onclick="saveProduct()">

            💾 Salvar produto

          </button>


          <button
            class="btn-secondary"
            onclick="clearForm()">

            Limpar

          </button>

        </div>

      </section>


      <!-- =================================================
           LISTA DE PRODUTOS
           ================================================= -->

      <section class="card">

        <div class="section-title">

          <h2>
            📦 Produtos cadastrados
          </h2>

          <button
            class="btn-primary"
            onclick="loadProducts()">

            🔄 Atualizar

          </button>

        </div>


        <div
          id="productList"
          class="product-list">

          <div class="loading">
            Carregando produtos...
          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       CONFIGURAÇÃO DO SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://yrhpvadtscugkcqnmmda.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_SArSO4fHx4-elZZuO2C-ag_4pz5hSQZ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    let editingProduct = null;


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          const {
            data: {
              session
            }
          } = await supabaseClient.auth.getSession();


          if (session) {

            await checkAdmin();

          }

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =====================================================
       MENSAGENS
       ===================================================== */

    function showStatus(
      elementId,
      message,
      type = "success"
    ) {

      const element =
        document.getElementById(elementId);

      if (!element) return;

      element.textContent = message;

      element.className =
        "status " + type;

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showStatus(
          "loginStatus",
          "Preencha o e-mail e a senha.",
          "error"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Entrando...";


      try {

        const {
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          console.error(error);

          showStatus(
            "loginStatus",
            "E-mail ou senha incorretos.",
            "error"
          );

          return;

        }


        await checkAdmin();

      } catch (error) {

        console.error(error);

        showStatus(
          "loginStatus",
          "Erro ao entrar. Tente novamente.",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Entrar";

      }

    }


    /* =====================================================
       VERIFICAR ADMIN
       ===================================================== */

    async function checkAdmin() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "is_admin"
          );


        if (error) {

          console.error(error);

          throw error;

        }


        if (data !== true) {

          await supabaseClient.auth.signOut();

          showStatus(
            "loginStatus",
            "Este usuário não possui acesso de administrador.",
            "error"
          );

          return;

        }


        document
          .getElementById("loginScreen")
          .classList
          .add("hidden");


        document
          .getElementById("adminScreen")
          .classList
          .remove("hidden");


        await loadProducts();

      } catch (error) {

        console.error(error);

        showStatus(
          "loginStatus",
          "Não foi possível verificar o administrador.",
          "error"
        );

      }

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    async function logout() {

      await supabaseClient.auth.signOut();

      location.reload();

    }


    /* =====================================================
       CARREGAR PRODUTOS
       ===================================================== */

    async function loadProducts() {

      const list =
        document.getElementById(
          "productList"
        );


      list.innerHTML =
        '<div class="loading">Carregando produtos...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*")
          .order("category", {
            ascending: true
          })
          .order("sort_order", {
            ascending: true
          })
          .order("name", {
            ascending: true
          });


      if (error) {

        console.error(error);

        list.innerHTML =
          '<div class="loading">Erro ao carregar produtos.</div>';

        showStatus(
          "globalStatus",
          "Erro ao carregar produtos.",
          "error"
        );

        return;

      }


      if (!data || data.length === 0) {

        list.innerHTML =
          '<div class="loading">Nenhum produto cadastrado.</div>';

        return;

      }


      list.innerHTML =
        data
          .map(productCard)
          .join("");

    }


    /* =====================================================
       CARD DO PRODUTO
       ===================================================== */

    function productCard(product) {

      const image =
        product.image_url ||
        "https://placehold.co/300x300?text=Sem+foto";


      const category =
        product.category === "garrafa"
          ? "🍰 Tentações em Garrafa"
          : "🥤 Bebida";


      const price =
        Number(product.price || 0)
          .toLocaleString(
            "pt-BR",
            {
              style: "currency",
              currency: "BRL"
            }
          );


      let oldPrice = "";


      if (
        product.old_price !== null &&
        product.old_price !== undefined &&
        product.old_price !== ""
      ) {

        oldPrice =
          `
          <span class="old-price">
            ${
              Number(product.old_price)
                .toLocaleString(
                  "pt-BR",
                  {
                    style: "currency",
                    currency: "BRL"
                  }
                )
            }
          </span>
          `;

      }


      const inactive =
        product.active
          ? ""
          : "inactive";


      return `

        <div class="product ${inactive}">

          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name)}"
            onerror="this.src='https://placehold.co/300x300?text=Sem+foto'">


          <div class="product-info">

            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>


            <div class="product-desc">
              ${escapeHtml(product.description || "")}
            </div>


            <div class="price">
              ${price}
              ${oldPrice}
            </div>


            <span class="tag">
              ${category}
            </span>


            <span class="tag">
              ${
                product.active
                  ? "✅ Ativo"
                  : "❌ Inativo"
              }
            </span>


            <div class="actions">

              <button
                class="btn-primary"
                onclick="editProduct('${product.id}')">

                ✏️ Editar

              </button>


              <button
                class="${
                  product.active
                    ? "btn-secondary"
                    : "btn-success"
                }"
                onclick="toggleProduct(
                  '${product.id}',
                  ${product.active}
                )">

                ${
                  product.active
                    ? "👁️ Desativar"
                    : "👁️ Ativar"
                }

              </button>


              <button
                class="btn-danger"
                onclick="deleteProduct(
                  '${product.id}',
                  '${escapeJs(product.name)}'
                )">

                🗑️ Excluir

              </button>

            </div>

          </div>

        </div>

      `;

    }


    /* =====================================================
       SALVAR PRODUTO
       ===================================================== */

    async function saveProduct() {

      const id =
        document
          .getElementById("productId")
          .value;


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();
