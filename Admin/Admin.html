<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Home Mousse's — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f3f0;
  color:#292522;
}

header{
  background:#292522;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:20px;
}

main{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0001;
}

input,textarea,select{
  width:100%;
  padding:11px;
  margin:5px 0 14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#292522;
  color:white;
}

.secondary{
  background:#eee;
}

.danger{
  background:#b3261e;
  color:white;
}

.hidden{
  display:none!important;
}

.product{
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  background:#eee;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 7px;
}

.price{
  font-size:18px;
  font-weight:bold;
}

.old{
  color:#888;
  text-decoration:line-through;
  margin-left:8px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.message{
  margin-top:10px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:75px;
    height:75px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🍰 Sweet Home Mousse's</h1>
  <button id="logout" class="secondary hidden">Sair</button>
</header>

<main>

<!-- LOGIN -->
<section id="loginBox" class="card">
  <h2>Área administrativa</h2>

  <label>E-mail</label>
  <input id="email" type="email">

  <label>Senha</label>
  <input id="password" type="password">

  <button class="primary" onclick="login()">Entrar</button>

  <div id="loginMessage" class="message"></div>
</section>


<!-- PAINEL -->
<section id="adminBox" class="hidden">

  <div class="card">
    <div class="actions">
      <button class="primary" onclick="novoProduto()">➕ Novo produto</button>
      <button class="secondary" onclick="carregarProdutos()">🔄 Atualizar</button>
    </div>

    <p id="status"></p>
  </div>


  <!-- EDITOR -->
  <div id="editor" class="card hidden">

    <h2 id="editorTitle">Novo produto</h2>

    <input type="hidden" id="productId">

    <div class="grid">

      <div>
        <label>Nome do produto</label>
        <input id="name">

        <label>Descrição</label>
        <textarea id="description"></textarea>

        <label>Preço</label>
        <input id="price" type="number" step="0.01" min="0">

        <label>Preço antigo (opcional)</label>
        <input id="oldPrice" type="number" step="0.01" min="0">
      </div>

      <div>

        <label>Categoria</label>
        <select id="category">
          <option value="garrafa">Tentações em Garrafa</option>
          <option value="bebida">Bebida</option>
        </select>

        <label>Imagem</label>
        <input id="imageFile" type="file" accept="image/*">

        <label>Endereço da imagem atual</label>
        <input id="imageUrl">

        <label>Produto ativo?</label>
        <select id="active">
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>

        <label>Ordem</label>
        <input id="sortOrder" type="number" value="0">
      </div>

    </div>

    <div class="actions">
      <button class="primary" onclick="salvarProduto()">💾 Salvar</button>
      <button class="secondary" onclick="fecharEditor()">Cancelar</button>
      <button id="deleteButton" class="danger hidden" onclick="excluirProduto()">Excluir</button>
    </div>

    <div id="editMessage" class="message"></div>

  </div>


  <!-- LISTA -->
  <div id="products"></div>

</section>

</main>


<script>

const supabaseClient = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY
);

let produtos = [];


async function iniciar(){

  const {data} = await supabaseClient.auth.getSession();

  if(data.session){
    mostrarPainel();
  }else{
    mostrarLogin();
  }

}


function mostrarLogin(){

  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("adminBox").classList.add("hidden");
  document.getElementById("logout").classList.add("hidden");

}


function mostrarPainel(){

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
  document.getElementById("logout").classList.remove("hidden");

  carregarProdutos();

}


async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  document.getElementById("loginMessage").textContent="Entrando...";

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    document.getElementById("loginMessage").textContent=
      "Erro: "+error.message;

    return;

  }

  mostrarPainel();

}


document.getElementById("logout").onclick=async()=>{

  await supabaseClient.auth.signOut();
  mostrarLogin();

};


async function carregarProdutos(){

  document.getElementById("status").textContent="Carregando produtos...";

  const {data,error}=await supabaseClient
    .from("products")
    .select("*")
    .order("category")
    .order("sort_order");

  if(error){

    document.getElementById("status").textContent=
      "Erro: "+error.message;

    return;

  }

  produtos=data || [];

  document.getElementById("status").textContent=
    produtos.length+" produto(s) encontrado(s).";

  mostrarProdutos();

}


function mostrarProdutos(){

  const area=document.getElementById("products");

  area.innerHTML="";

  produtos.forEach(produto=>{

    const div=document.createElement("div");

    div.className="card product";

    div.innerHTML=`

      <img src="${produto.image_url || ""}"
           onerror="this.style.display='none'">

      <div class="product-info">

        <h3>
          ${produto.name}
          ${produto.active ? "" : " — INATIVO"}
        </h3>

        <div class="price">
          R$ ${Number(produto.price).toFixed(2).replace(".",",")}
          ${
            produto.old_price
            ?
            `<span class="old">
              R$ ${Number(produto.old_price).toFixed(2).replace(".",",")}
            </span>`
            :
            ""
          }
        </div>

        <p>${produto.description || ""}</p>

        <div class="actions">
          <button class="primary"
                  onclick="editarProduto('${produto.id}')">
            ✏️ Editar
          </button>
        </div>

      </div>
    `;

    area.appendChild(div);

  });

}


function novoProduto(){

  document.getElementById("editorTitle").textContent="Novo produto";

  document.getElementById("productId").value="";
  document.getElementById("name").value="";
  document.getElementById("description").value="";
  document.getElementById("price").value="";
  document.getElementById("oldPrice").value="";
  document.getElementById("category").value="garrafa";
  document.getElementById("imageUrl").value="";
  document.getElementById("active").value="true";
  document.getElementById("sortOrder").value="0";
  document.getElementById("imageFile").value="";

  document.getElementById("deleteButton").classList.add("hidden");

  document.getElementById("editor").classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function editarProduto(id){

  const p=produtos.find(x=>x.id===id);

  if(!p)return;

  document.getElementById("editorTitle").textContent="Editar produto";

  document.getElementById("productId").value=p.id;
  document.getElementById("name").value=p.name || "";
  document.getElementById("description").value=p.description || "";
  document.getElementById("price").value=p.price ?? "";
  document.getElementById("oldPrice").value=p.old_price ?? "";
  document.getElementById("category").value=p.category || "garrafa";
  document.getElementById("imageUrl").value=p.image_url || "";
  document.getElementById("active").value=String(p.active);
  document.getElementById("sortOrder").value=p.sort_order ?? 0;
  document.getElementById("imageFile").value="";

  document.getElementById("deleteButton").classList.remove("hidden");

  document.getElementById("editor").classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function fecharEditor(){

  document.getElementById("editor").classList.add("hidden");

}


async function enviarImagem(file){

  const extensao=file.name.split(".").pop();

  const nome=
    "products/"+crypto.randomUUID()+"."+extensao;

  const {error}=await supabaseClient
    .storage
    .from("product-images")
    .upload(nome,file);

  if(error)throw error;

  const {data}=supabaseClient
    .storage
    .from("product-images")
    .getPublicUrl(nome);

  return data.publicUrl;

}


async function salvarProduto(){

  const id=document.getElementById("productId").value;

  const nome=document.getElementById("name").value.trim();
  const descricao=document.getElementById("description").value.trim();
  const preco=Number(document.getElementById("price").value);
  const precoAntigo=
    document.getElementById("oldPrice").value
    ?
    Number(document.getElementById("oldPrice").value)
    :
    null;

  let imagem=document.getElementById("imageUrl").value.trim();

  const arquivo=document.getElementById("imageFile").files[0];

  document.getElementById("editMessage").textContent=
    "Salvando...";

  try{

    if(!nome || Number.isNaN(preco)){
      throw new Error("Informe o nome e o preço.");
    }

    if(arquivo){
      imagem=await enviarImagem(arquivo);
    }

    const dados={

      name:nome,
      description:descricao,
      price:preco,
      old_price:precoAntigo,
      category:document.getElementById("category").value,
      image_url:imagem || null,
      active:document.getElementById("active").value==="true",
      sort_order:Number(document.getElementById("sortOrder").value || 0),
      updated_at:new Date().toISOString()

    };


    let resultado;

    if(id){

      resultado=await supabaseClient
        .from("products")
        .update(dados)
        .eq("id",id);

    }else{

      resultado=await supabaseClient
        .from("products")
        .insert(dados);

    }


    if(resultado.error){
      throw resultado.error;
    }


    document.getElementById("editMessage").textContent=
      "✅ Produto salvo com sucesso!";

    fecharEditor();

    await carregarProdutos();

  }catch(error){

    document.getElementById("editMessage").textContent=
      "❌ "+error.message;

  }

}


async function excluirProduto(){

  const id=document.getElementById("productId").value;

  if(!id)return;

  if(!confirm("Tem certeza que deseja excluir este produto?")){
    return;
  }

  const {error}=await supabaseClient
    .from("products")
    .delete()
    .eq("id",id);

  if(error){

    document.getElementById("editMessage").textContent=
      "❌ "+error.message;

    return;

  }

  fecharEditor();

  carregarProdutos();

}


iniciar();

</script>

</body>
  </html>
